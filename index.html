<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Workout Club</title>
    <meta name="description" content="Personal coaching and body transformation at The Workout Club." />
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Open Graph & Twitter Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Workout Club" />
    <meta property="og:description" content="Personal coaching and body transformation at The Workout Club." />
    <meta property="og:image" content="/social-share.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Workout Club" />
    <meta name="twitter:description" content="Personal coaching and body transformation at The Workout Club." />
    <meta name="twitter:image" content="/social-share.png" />

    <!-- Performance: Preconnect & Preload Critical Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />

    <!-- Performance & Security Meta -->
    <meta name="robots" content="max-image-preview:large" />
    <meta name="theme-color" content="#0d0d0d" />

    <!-- Critical CSS for Instant Paint (Zero FOIT/FOUC) -->
    <style>
      html {
        scroll-behavior: smooth;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f5f5f0;
      }
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #f5f5f0;
        color: #0d0d0d;
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #__framer-badge-container {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
